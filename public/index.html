<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>meye tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #0f1412;
        --bg1: #1a221c;
        --ink: #e7ede6;
        --muted: #8a968c;
        --line: #2c382f;
        --accent: #c4a35a;
        --accent-dim: #8a7340;
        --danger: #d07060;
        --field: #121916;
        --radius: 6px;
        --font: "Instrument Sans", system-ui, sans-serif;
        --display: "Newsreader", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #243028 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #1c2420 0%, transparent 50%),
          var(--bg0);
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }

      header {
        margin-bottom: 2rem;
      }

      header .brand {
        font-family: var(--display);
        font-size: clamp(2.4rem, 5vw, 3.4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        margin: 0;
      }

      header .brand span {
        color: var(--accent);
      }

      header p {
        margin: 0.55rem 0 0;
        color: var(--muted);
        max-width: 36rem;
        font-size: 1.05rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 400px) 1fr;
        gap: 1.75rem;
        align-items: start;
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: color-mix(in srgb, var(--bg1) 88%, black);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.15rem 1.2rem 1.35rem;
      }

      .panel-form {
        max-height: calc(100vh - 8rem);
        overflow: auto;
      }

      .tabs {
        display: flex;
        gap: 0.35rem;
        margin-bottom: 1.1rem;
        flex-wrap: wrap;
      }

      .tabs button {
        flex: 1;
        min-width: 4.5rem;
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        padding: 0.55rem 0.55rem;
        border-radius: 999px;
        cursor: pointer;
      }

      .tabs button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1408;
      }

      label.field-label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0.75rem 0 0.35rem;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        appearance: none;
        background: var(--field);
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
        border-radius: var(--radius);
        padding: 0.55rem 0.65rem;
      }

      textarea {
        min-height: 4.2rem;
        resize: vertical;
      }

      input[type="text"]:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-color: var(--accent-dim);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
      }

      details.block {
        margin-top: 0.9rem;
        border-top: 1px solid var(--line);
        padding-top: 0.7rem;
      }

      details.block summary {
        cursor: pointer;
        color: var(--accent);
        font-weight: 600;
        list-style: none;
      }

      details.block summary::-webkit-details-marker {
        display: none;
      }

      .flags {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem 0.75rem;
        margin-top: 0.55rem;
      }

      .flags label {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--ink);
        margin: 0;
        cursor: pointer;
      }

      .flags input[type="checkbox"] {
        appearance: auto;
        -webkit-appearance: checkbox;
        width: 1.15rem;
        height: 1.15rem;
        margin: 0;
        flex-shrink: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .effect {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 0.65rem;
        margin-top: 0.55rem;
        background: var(--field);
      }

      .effect-head {
        display: flex;
        gap: 0.5rem;
        align-items: end;
      }

      .effect-head > div {
        flex: 1;
      }

      .effect .remove {
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--danger);
        border-radius: var(--radius);
        padding: 0.5rem 0.6rem;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
      }

      .add-effect {
        margin-top: 0.6rem;
        appearance: none;
        border: 1px dashed var(--line);
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-weight: 600;
        width: 100%;
        padding: 0.55rem;
        border-radius: var(--radius);
        cursor: pointer;
      }

      .actions {
        display: flex;
        gap: 0.6rem;
        margin-top: 1.15rem;
        flex-wrap: wrap;
      }

      .actions button {
        appearance: none;
        border: 0;
        font: inherit;
        font-weight: 700;
        border-radius: var(--radius);
        padding: 0.7rem 1rem;
        cursor: pointer;
      }

      .actions .primary {
        background: var(--accent);
        color: #1a1408;
        flex: 1;
      }

      .actions .ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
      }

      .error {
        margin-top: 0.85rem;
        color: var(--danger);
        font-size: 0.92rem;
        white-space: pre-wrap;
      }

      .item-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .item-list button {
        width: 100%;
        text-align: left;
        appearance: none;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--ink);
        font: inherit;
        border-radius: var(--radius);
        padding: 0.65rem 0.75rem;
        cursor: pointer;
      }

      .item-list button:hover {
        border-color: var(--accent-dim);
      }

      .item-list .name {
        display: block;
        font-weight: 600;
      }

      .item-list .id {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        font-family: ui-monospace, monospace;
        margin-top: 0.15rem;
      }

      .result h2 {
        font-family: var(--display);
        font-weight: 600;
        font-size: 1.55rem;
        margin: 0 0 0.35rem;
      }

      .codes {
        color: var(--muted);
        font-size: 0.92rem;
        margin-bottom: 1rem;
      }

      .codes code {
        color: var(--accent);
        font-family: ui-monospace, monospace;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 0.55rem;
        margin-bottom: 1.2rem;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 0.5rem 0.6rem;
      }

      .stat b {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
      }

      .stat span {
        font-size: 1.05rem;
        font-weight: 600;
      }

      .effects-out {
        margin: 0 0 1.1rem;
        padding: 0;
        list-style: none;
      }

      .effects-out li {
        border-left: 2px solid var(--accent-dim);
        padding: 0.35rem 0 0.35rem 0.7rem;
        margin-bottom: 0.55rem;
      }

      .effects-out strong {
        display: block;
        color: var(--accent);
        font-size: 0.9rem;
      }

      .effects-out span {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.85rem;
      }

      @media (max-width: 700px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }

      .card-slot {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: #0a0d0b;
        min-height: 180px;
        display: grid;
        place-items: center;
      }

      .card-slot img {
        width: 100%;
        height: auto;
        display: block;
      }

      .card-slot .ph {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 2rem;
        text-align: center;
      }

      .empty {
        color: var(--muted);
        padding: 2rem 0.5rem;
      }

      a.docs {
        color: var(--muted);
        font-size: 0.85rem;
        float: right;
        margin-top: 0.4rem;
      }

      a.docs:hover {
        color: var(--accent);
      }

      .mode-hint {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0 0 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <a class="docs" href="/docs">API docs</a>
        <h1 class="brand">meye <span>tools</span></h1>
        <p>
          Crea, lista y edita objetos; genera frente y reverso de la carta.
        </p>
      </header>

      <div class="layout">
        <section class="panel panel-form">
          <div class="tabs" role="tablist">
            <button type="button" class="active" data-mode="edit">Editor</button>
            <button type="button" data-mode="list">Lista</button>
            <button type="button" data-mode="load">Código</button>
          </div>

          <form id="edit-form">
            <p class="mode-hint" id="edit-hint">Nuevo objeto</p>

            <label class="field-label" for="name">Nombre</label>
            <input
              id="name"
              type="text"
              placeholder="requerido para guardar"
            />

            <div class="row">
              <div>
                <label class="field-label" for="class">Clase</label>
                <select id="class" required></select>
              </div>
              <div>
                <label class="field-label" for="type">Tipo</label>
                <select id="type" required></select>
              </div>
            </div>

            <label class="field-label" for="material">Material</label>
            <select id="material" required></select>

            <div class="row">
              <div>
                <label class="field-label" for="dimension">Dimensión</label>
                <select id="dimension" required></select>
              </div>
              <div>
                <label class="field-label" for="thickness">Grosor</label>
                <select id="thickness" required></select>
              </div>
            </div>

            <label class="field-label" for="quality">Calidad</label>
            <select id="quality" required></select>

            <details class="block" id="extra-block">
              <summary>Extra (origen, subtipo, flags…)</summary>
              <label class="field-label" for="origin">Origen</label>
              <select id="origin"></select>
              <div class="row">
                <div>
                  <label class="field-label" for="sub_type">Subtipo</label>
                  <select id="sub_type"></select>
                </div>
                <div>
                  <label class="field-label" for="specialization"
                    >Especialización</label
                  >
                  <select id="specialization"></select>
                </div>
              </div>
              <div class="row">
                <div>
                  <label class="field-label" for="extra_material"
                    >Material extra</label
                  >
                  <select id="extra_material"></select>
                </div>
                <div>
                  <label class="field-label" for="extra_thickness"
                    >Grosor extra</label
                  >
                  <select id="extra_thickness"></select>
                </div>
              </div>
              <label class="field-label">Flags místicas</label>
              <div class="flags" id="flags"></div>
            </details>

            <details class="block" id="effects-block" open>
              <summary>Efectos / historia (reverso)</summary>
              <div id="effects"></div>
              <button type="button" class="add-effect" id="add-effect">
                + Añadir efecto
              </button>
            </details>

            <div class="actions">
              <button class="primary" type="submit" id="save-btn">
                Guardar y ver carta
              </button>
              <button class="ghost" type="button" id="reset-btn">Nuevo</button>
            </div>
          </form>

          <div id="list-panel" hidden>
            <p class="mode-hint">Objetos guardados — clic para editar</p>
            <ul class="item-list" id="item-list"></ul>
          </div>

          <form id="load-form" hidden>
            <label class="field-label" for="base">Código base</label>
            <input id="base" type="text" placeholder="Bpi3" required />
            <label class="field-label" for="custom">Código custom</label>
            <input id="custom" type="text" placeholder="DuaA-10" />
            <div class="actions">
              <button class="primary" type="submit">Cargar en editor</button>
            </div>
          </form>

          <div class="error" id="error" hidden></div>
        </section>

        <section class="panel result" id="result">
          <div class="empty" id="empty">
            Aún no hay carta. Crea o abre un objeto de la lista.
          </div>
          <div id="out" hidden>
            <h2 id="title"></h2>
            <div class="codes"><code id="code-line"></code></div>
            <div class="stats" id="stats"></div>
            <ul class="effects-out" id="effects-out"></ul>
            <div class="cards">
              <div class="card-slot">
                <span class="ph" id="front-ph">frente…</span>
                <img id="front" alt="Carta frente" hidden />
              </div>
              <div class="card-slot">
                <span class="ph" id="back-ph">reverso…</span>
                <img id="back" alt="Carta reverso" hidden />
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let meta = null;
      let frontUrl = null;
      let backUrl = null;
      let editingId = null;

      const EFFECT_SUGGESTIONS = [
        "Historia",
        "Transfondo",
        "Diseño",
        "Construcción",
        "Grafia",
        "Lazado",
        "Alquimia",
        "Ilusion",
        "Cenobia",
        "Propiedad",
      ];

      function showError(msg) {
        const el = $("error");
        el.hidden = !msg;
        el.textContent = msg || "";
      }

      function fillSelect(el, items, labelFn = (x) => x, valueFn = (x) => x) {
        el.innerHTML = "";
        for (const item of items) {
          const opt = document.createElement("option");
          opt.value = valueFn(item);
          opt.textContent = labelFn(item);
          el.appendChild(opt);
        }
      }

      function setSelectValue(el, value) {
        if (value == null || value === "") return;
        const v = String(value);
        if (![...el.options].some((o) => o.value === v)) {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = v;
          el.appendChild(opt);
        }
        el.value = v;
      }

      function refreshClassDeps() {
        const c = $("class").value;
        fillSelect($("type"), meta.typesByClass[c] || []);
        fillSelect($("sub_type"), ["none", ...(meta.subTypesByClass[c] || [])]);
        fillSelect($("specialization"), [
          "none",
          ...(meta.specializationsByClass[c] || []),
        ]);
      }

      function setMode(mode) {
        document.querySelectorAll(".tabs button").forEach((b) => {
          b.classList.toggle("active", b.dataset.mode === mode);
        });
        $("edit-form").hidden = mode !== "edit";
        $("list-panel").hidden = mode !== "list";
        $("load-form").hidden = mode !== "load";
        showError("");
        if (mode === "list") refreshList();
      }

      function addEffectRow(title = "", description = "") {
        const row = document.createElement("div");
        row.className = "effect";
        row.innerHTML = `
          <div class="effect-head">
            <div>
              <label class="field-label">Título</label>
              <input type="text" class="effect-title" list="effect-titles" placeholder="Historia, Transfondo…" value="" />
            </div>
            <button type="button" class="remove">Quitar</button>
          </div>
          <label class="field-label">Descripción</label>
          <textarea class="effect-desc" placeholder="Texto del reverso"></textarea>
        `;
        row.querySelector(".effect-title").value = title;
        row.querySelector(".effect-desc").value = description;
        row.querySelector(".remove").addEventListener("click", () => row.remove());
        $("effects").appendChild(row);
      }

      function collectEffects() {
        return [...$("effects").querySelectorAll(".effect")]
          .map((row) => ({
            title: row.querySelector(".effect-title").value.trim(),
            description: row.querySelector(".effect-desc").value.trim(),
          }))
          .filter((e) => e.title || e.description)
          .filter((e) => e.title && e.description);
      }

      function buildBody() {
        const origin = $("origin").value;
        const sub_type = $("sub_type").value;
        const specialization = $("specialization").value;
        const flags = [...document.querySelectorAll("#flags input:checked")].map(
          (i) => i.value
        );
        const extraMat = $("extra_material").value;
        const extraTh = $("extra_thickness").value;
        const useExtra =
          origin ||
          (sub_type && sub_type !== "none") ||
          (specialization && specialization !== "none") ||
          flags.length ||
          extraMat;

        const name = $("name").value.trim();
        const body = {
          name: name || undefined,
          class: $("class").value,
          type: $("type").value,
          material: $("material").value,
          dimension: Number($("dimension").value),
          thickness: Number($("thickness").value),
          quality: Number($("quality").value),
          effects: collectEffects(),
          persist: Boolean(name),
        };
        if (useExtra) {
          body.extra = {
            origin: origin || "desconocido",
            sub_type: sub_type || "none",
            specialization: specialization || "none",
            flags,
          };
          if (extraMat) {
            body.extra.material = extraMat;
            body.extra.thickness = Number(extraTh || 0);
          }
        }
        return body;
      }

      function fillFormFromItem(item) {
        editingId = item.custom_code
          ? `${item.code}-${item.custom_code}`
          : item.code;
        $("edit-hint").textContent = `Editando ${editingId}`;
        $("name").value = item.name || "";
        setSelectValue($("class"), item.class);
        refreshClassDeps();
        setSelectValue($("type"), item.type);
        setSelectValue($("material"), item.material);
        setSelectValue($("dimension"), item.dimension);
        setSelectValue($("thickness"), Number(item.thickness));
        setSelectValue($("quality"), Number(item.quality));

        const ex = item.extra || {};
        if (
          ex.origin ||
          ex.sub_type ||
          ex.specialization ||
          (ex.flags && ex.flags.length) ||
          ex.material
        ) {
          $("extra-block").open = true;
        }
        setSelectValue($("origin"), ex.origin || "");
        setSelectValue($("sub_type"), ex.sub_type || "none");
        setSelectValue($("specialization"), ex.specialization || "none");
        setSelectValue($("extra_material"), ex.material || "");
        setSelectValue($("extra_thickness"), ex.thickness ?? "");
        document.querySelectorAll("#flags input").forEach((cb) => {
          cb.checked = Array.isArray(ex.flags) && ex.flags.includes(cb.value);
        });

        $("effects").innerHTML = "";
        const effects = item.effects || [];
        if (effects.length) {
          $("effects-block").open = true;
          effects.forEach((e) => addEffectRow(e.title, e.description));
        } else {
          addEffectRow();
        }
      }

      function resetForm() {
        editingId = null;
        $("edit-hint").textContent = "Nuevo objeto";
        $("edit-form").reset();
        refreshClassDeps();
        $("dimension").value = "5";
        $("thickness").value = "2";
        $("quality").value = "0.7";
        $("origin").value = "";
        $("extra_material").value = "";
        document.querySelectorAll("#flags input").forEach((cb) => {
          cb.checked = false;
        });
        $("effects").innerHTML = "";
        addEffectRow("Historia", "");
        addEffectRow("Transfondo", "");
      }

      function cardPath(base, custom, side) {
        const enc = encodeURIComponent;
        if (custom) return `/items/${enc(base)}/${enc(custom)}/card/${side}`;
        return `/items/${enc(base)}/card/${side}`;
      }

      async function showItem(item) {
        $("empty").hidden = true;
        $("out").hidden = false;
        $("title").textContent = item.name || item.type || "Objeto";
        const id = item.custom_code
          ? `${item.code}-${item.custom_code}`
          : item.code;
        $("code-line").textContent = `#${id} · ${item.crafting_level} · ${item.rarity}`;

        const stats = [
          ["Daño", item.damage],
          ["Corte", item.slice],
          ["Desangre", item.bleeding],
          ["Peso", item.weight],
          ["Lance", item.throwing],
          ["Amort.", item.damping],
          ["Resist.", item.resistence],
          ["Vida", item.useful_life],
        ];
        $("stats").innerHTML = stats
          .map(
            ([k, v]) =>
              `<div class="stat"><b>${k}</b><span>${v ?? "—"}</span></div>`
          )
          .join("");

        const effects = item.effects || [];
        $("effects-out").innerHTML = effects
          .map(
            (e) =>
              `<li><strong>${escapeHtml(e.title)}</strong><span>${escapeHtml(
                e.description
              )}</span></li>`
          )
          .join("");

        if (frontUrl) URL.revokeObjectURL(frontUrl);
        if (backUrl) URL.revokeObjectURL(backUrl);
        $("front").hidden = true;
        $("back").hidden = true;
        $("front-ph").hidden = false;
        $("back-ph").hidden = false;
        $("front-ph").textContent = "generando frente…";
        $("back-ph").textContent = "generando reverso…";

        const bust = `?t=${Date.now()}`;
        const [frontRes, backRes] = await Promise.all([
          fetch(cardPath(item.code, item.custom_code, "front") + bust),
          fetch(cardPath(item.code, item.custom_code, "back") + bust),
        ]);
        if (!frontRes.ok) throw new Error("No se pudo generar el frente");
        if (!backRes.ok) throw new Error("No se pudo generar el reverso");

        frontUrl = URL.createObjectURL(await frontRes.blob());
        backUrl = URL.createObjectURL(await backRes.blob());
        $("front").src = frontUrl;
        $("back").src = backUrl;
        $("front").hidden = false;
        $("back").hidden = false;
        $("front-ph").hidden = true;
        $("back-ph").hidden = true;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      async function fetchItem(base, custom) {
        const url = custom
          ? `/items/${encodeURIComponent(base)}/${encodeURIComponent(custom)}`
          : `/items/${encodeURIComponent(base)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || res.statusText);
        return data;
      }

      async function openItem(base, custom) {
        const item = await fetchItem(base, custom);
        fillFormFromItem(item);
        setMode("edit");
        await showItem(item);
      }

      async function refreshList() {
        const res = await fetch("/items");
        const items = await res.json();
        if (!res.ok) throw new Error(items.message || res.statusText);
        const list = $("item-list");
        if (!items.length) {
          list.innerHTML =
            '<li class="empty" style="padding:0.5rem">No hay objetos guardados.</li>';
          return;
        }
        list.innerHTML = "";
        for (const it of items) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.innerHTML = `<span class="name">${escapeHtml(
            it.name
          )}</span><span class="id">${escapeHtml(it.id)}</span>`;
          btn.addEventListener("click", async () => {
            try {
              showError("");
              await openItem(it.base_code, it.custom_code || undefined);
            } catch (err) {
              showError(err.message || String(err));
            }
          });
          li.appendChild(btn);
          list.appendChild(li);
        }
      }

      document.querySelectorAll(".tabs button").forEach((b) => {
        b.addEventListener("click", () => setMode(b.dataset.mode));
      });

      $("class").addEventListener("change", refreshClassDeps);
      $("add-effect").addEventListener("click", () => addEffectRow());
      $("reset-btn").addEventListener("click", () => {
        resetForm();
        showError("");
      });

      $("edit-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        const body = buildBody();
        if (!body.name) {
          showError("Pon un nombre para guardar el objeto.");
          return;
        }
        try {
          const res = await fetch("/items", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || res.statusText);
          fillFormFromItem(data);
          await showItem(data);
        } catch (err) {
          showError(err.message || String(err));
        }
      });

      $("load-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        try {
          await openItem($("base").value.trim(), $("custom").value.trim() || undefined);
        } catch (err) {
          showError(err.message || String(err));
        }
      });

      (async () => {
        try {
          const res = await fetch("/meta");
          meta = await res.json();
          if (!res.ok) throw new Error(meta.message || "meta failed");

          const datalist = document.createElement("datalist");
          datalist.id = "effect-titles";
          datalist.innerHTML = EFFECT_SUGGESTIONS.map(
            (t) => `<option value="${t}"></option>`
          ).join("");
          document.body.appendChild(datalist);

          fillSelect($("class"), meta.classes.filter((c) => c !== "desconocido"));
          fillSelect(
            $("material"),
            meta.materials,
            (m) => `${m.symbol} — ${m.name}`,
            (m) => m.symbol
          );
          fillSelect($("dimension"), meta.sizes);
          fillSelect($("thickness"), meta.sizes);
          fillSelect($("quality"), meta.qualities);
          fillSelect($("origin"), ["", ...meta.origins], (o) => o || "(ninguno)");
          fillSelect(
            $("extra_material"),
            [{ symbol: "", name: "(ninguno)" }, ...meta.materials],
            (m) => (m.symbol ? `${m.symbol} — ${m.name}` : m.name),
            (m) => m.symbol
          );
          fillSelect($("extra_thickness"), ["", ...meta.sizes], (s) =>
            s === "" ? "(—)" : s
          );
          $("flags").innerHTML = meta.flags
            .map(
              (f) =>
                `<label><input type="checkbox" value="${f}" /> <span>${f}</span></label>`
            )
            .join("");
          resetForm();
        } catch (err) {
          showError("No se pudo cargar /meta: " + err.message);
        }
      })();
    </script>
  </body>
</html>
